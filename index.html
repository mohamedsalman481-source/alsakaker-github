<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="description" content="السكاكر — مغامرة ليلى وليالي العائلية عبر 15 مرحلة مليئة بالحلوى والأسرار." />
  <meta name="theme-color" content="#6c35d9" />
  <meta name="color-scheme" content="dark" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="السكاكر — ليلى وليالي" />
  <meta property="og:description" content="مغامرة عائلية من 15 مرحلة. اختاري البطلة، اجمعي السكاكر، وواجهي وحوش مملكة الحلوى." />
  <meta property="og:image" content="icons/icon.svg" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>السكاكر — ليلى وليالي</title>
  <style>
    :root{--ink:#25123f;--purple:#6c35d9;--pink:#ff4fa3;--cyan:#37d8ff;--gold:#ffd65a;--cream:#fff9e8}
    *{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#150d2e;font-family:Tahoma,Arial,sans-serif;color:white}
    body{display:grid;place-items:center;background:radial-gradient(circle at 50% 10%,#5430a3 0,#241449 45%,#100a25 100%)}
    #shell{position:relative;width:min(100vw,1280px);aspect-ratio:16/9;max-height:100vh;overflow:hidden;border:3px solid rgba(255,255,255,.2);border-radius:20px;box-shadow:0 28px 90px #070313cc;background:#7bdcff;isolation:isolate}
    canvas{width:100%;height:100%;display:block;touch-action:none}
    #hud{position:absolute;inset:12px 14px auto;display:grid;grid-template-columns:1.2fr 1fr 1.4fr;gap:10px;z-index:4;pointer-events:none;direction:rtl}
    .hudCard{min-height:55px;padding:8px 12px;border:2px solid #fff7;border-radius:15px;background:linear-gradient(180deg,#27144ede,#130a2cda);box-shadow:0 7px 0 #10072088,0 10px 30px #16062d66;backdrop-filter:blur(6px)}
    .hudTitle{font-size:12px;color:#d9caff}.big{font-weight:900;font-size:18px}.hearts{color:#ff5d8f;letter-spacing:1px;text-shadow:0 2px 0 #8c164d}.inv{display:flex;gap:7px;margin-top:4px;flex-wrap:wrap}.chip{padding:3px 8px;border-radius:20px;background:#ffffff1d;border:1px solid #fff4;font-size:12px}.bar{height:8px;background:#ffffff25;border-radius:10px;overflow:hidden;margin-top:5px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink),var(--gold));border-radius:10px;transition:width .2s}
    #overlay{position:absolute;inset:0;z-index:8;display:grid;place-items:center;padding:20px;background:linear-gradient(180deg,#130928b8,#12072ade);backdrop-filter:blur(5px)}
    #overlay.hidden{display:none}.panel{width:min(850px,94%);max-height:92%;overflow:auto;padding:28px;border:3px solid #fff8;border-radius:28px;background:linear-gradient(145deg,#3b1a76f5,#160a36f7);box-shadow:0 18px 0 #0c051d88,0 28px 80px #0a031dcc;text-align:center}
    .logo{margin:0;font-size:clamp(50px,8vw,108px);line-height:.95;font-weight:1000;letter-spacing:-5px;background:linear-gradient(90deg,#ff5daa,#ffd65a,#48e2ff,#b578ff,#ff5daa);background-size:220% 100%;-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 8px 0 #4a176f);animation:shine 5s linear infinite}.subLogo{font-size:clamp(20px,3vw,38px);font-weight:900;color:#fff;margin:12px 0 3px}.eyebrow{display:inline-block;padding:6px 12px;border-radius:999px;background:#ff4fa326;color:#ffd9ee;border:1px solid #ff7ebe66;font-weight:800;font-size:13px}.panel h2{margin:10px 0;font-size:clamp(28px,4vw,50px)}.panel p{line-height:1.8;color:#eee4ff;margin:8px auto 18px;max-width:720px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:20px 0}.choice{border:2px solid #ffffff50;background:linear-gradient(180deg,#ffffff18,#ffffff0b);border-radius:20px;padding:18px;text-align:right;cursor:pointer;color:white;transition:.18s;box-shadow:0 8px 0 #0e06299c}.choice:hover,.choice.selected{transform:translateY(-3px);border-color:#fff;background:#ffffff29;box-shadow:0 11px 0 #0e06299c}.choice b{display:block;font-size:21px;color:#ffe46f;margin-bottom:7px}.choice small{line-height:1.7;color:#e8ddff}.btn{appearance:none;border:0;border-radius:17px;padding:13px 24px;margin:6px;font:900 17px Tahoma;color:white;cursor:pointer;background:linear-gradient(135deg,#ff3b9d,#8f47e9);box-shadow:0 7px 0 #591a83,0 10px 25px #ff3b9d42;transition:.12s}.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #591a83}.btn.alt{background:linear-gradient(135deg,#20bde2,#3473e8);box-shadow:0 7px 0 #164e9c}.btn.gold{color:#4a2700;background:linear-gradient(135deg,#fff284,#ffad32);box-shadow:0 7px 0 #b36715}.btn:disabled{filter:grayscale(1);opacity:.45;cursor:not-allowed}.tip{font-size:13px;color:#c7b9e8}.warning{color:#ffd96a;font-weight:900}.portrait{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;margin:0 auto 8px;font-size:38px;border:3px solid white;background:linear-gradient(135deg,#ff8cc7,#684de5);box-shadow:0 7px 0 #1a0a3f}
    #controls{position:absolute;inset:auto 14px 14px;z-index:6;display:flex;justify-content:space-between;align-items:flex-end;direction:ltr;pointer-events:none}.cluster{display:flex;gap:9px;align-items:flex-end}.ctrl{pointer-events:auto;width:58px;height:58px;border-radius:50%;border:2px solid #fff8;background:#211243cf;color:#fff;font:bold 25px Arial;box-shadow:0 6px 0 #0c061d99;touch-action:none;user-select:none}.ctrl.sm{width:48px;height:48px;font-size:16px}.ctrl.pink{background:#c92883dd}.ctrl.cyan{background:#098dafdd}.ctrl.gold{background:#b77709dd}.ctrl:active{transform:translateY(4px);box-shadow:0 2px 0 #0c061d99}
    #topActions{position:absolute;left:12px;top:82px;z-index:7;display:flex;gap:7px}.mini{border:1px solid #fff6;border-radius:11px;padding:7px 10px;background:#160c34cc;color:white;font:bold 13px Tahoma;cursor:pointer}
    #toast{position:absolute;z-index:9;left:50%;bottom:100px;transform:translateX(-50%) translateY(30px);opacity:0;max-width:80%;padding:11px 18px;border-radius:14px;background:#160a36ed;border:2px solid #fff6;box-shadow:0 9px 30px #120526aa;font-weight:900;text-align:center;transition:.25s;pointer-events:none}#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @keyframes shine{to{background-position:220% 0}}@media(max-width:760px){#shell{border:0;border-radius:0;width:100vw;height:100vh;aspect-ratio:auto}#hud{grid-template-columns:1fr 1fr;inset:7px 7px auto;gap:6px}.hudCard{padding:6px 8px;min-height:44px}.hudCard:nth-child(3){grid-column:1/-1}.big{font-size:14px}.hudTitle,.chip{font-size:10px}.panel{padding:18px}.cards{grid-template-columns:1fr}.ctrl{width:54px;height:54px}#topActions{top:107px}}
  </style>
</head>
<body>
<main id="shell" aria-label="لعبة السكاكر">
  <canvas id="game" width="1280" height="720"></canvas>
  <section id="hud" hidden>
    <div class="hudCard"><div class="hudTitle" id="heroName">ليلى</div><div class="big hearts" id="hpText">♥ ♥ ♥ ♥ ♥</div></div>
    <div class="hudCard"><div class="hudTitle">النقاط · السكاكر</div><div class="big"><span id="scoreText">0</span> · 🍬 <span id="candyText">0</span></div></div>
    <div class="hudCard"><div class="hudTitle"><span id="levelText">المرحلة 1</span> · <span id="levelName"></span></div><div class="bar"><i id="progress" style="width:0%"></i></div><div class="inv" id="invText"></div></div>
  </section>
  <div id="topActions" hidden><button class="mini" id="muteBtn">🔊</button><button class="mini" id="fullBtn">⛶</button><button class="mini" id="pauseBtn">إيقاف</button></div>
  <div id="overlay"><div class="panel" id="panel"></div></div>
  <div id="toast"></div>
  <div id="controls" hidden>
    <div class="cluster"><button class="ctrl" data-key="ArrowLeft">◀</button><button class="ctrl" data-key="ArrowRight">▶</button></div>
    <div class="cluster"><button class="ctrl sm gold" id="itemBtn">🎒</button><button class="ctrl sm cyan" id="helpBtn">✦</button><button class="ctrl pink" data-key="KeyJ">✹</button><button class="ctrl" data-key="Space">↑</button></div>
  </div>
</main>
<script>
(()=>{
  'use strict';
  const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
  const $=s=>document.querySelector(s), hud=$('#hud'), controls=$('#controls'), overlay=$('#overlay'), panel=$('#panel'), toast=$('#toast');
  const W=1280,H=720,GROUND=615,GRAV=.78;
  const levels=[
    ['حدائق المصاصات','وحش العلكة اللزج','#7ce5ff','#ff78b7'],['نهر الشوكولاتة','أخطبوط الكاكاو','#79c9ff','#8f4b31'],['مدينة البسكويت','ملك الفتات','#ffd88a','#d68845'],['سحب السكر','صقر الغزل','#9be8ff','#ffb2dc'],['غابة الجيلي','عملاق الجيلي','#8bf0b1','#ad63ec'],['مصنع الفشار','ملك الفرقعة','#ffe177','#ff764a'],['جبال المارشميلو','حارس السحابة','#b6efff','#d7a4ff'],['بحر الصودا','قرش الفقاعات','#59d9ed','#3560d8'],['قلعة الآيس كريم','ساحرة الصقيع','#bdedff','#8465e8'],['متاهة العلكة','عنكبوت المضغ','#ff9ecb','#a53c91'],['صحراء الكراميل','عقرب الكراميل','#ffd172','#ba5d28'],['برج ساعة الحلوى','وحش تيك توك','#7fdce7','#7c50d1'],['منجم السكر الداكن','تنين العرقسوس','#5f6a9f','#201c45'],['قصر الحلويات المنسية','توأم المرآة','#c78dff','#4c276d'],['قلعة كسوف السكاكر','إمبراطور السكر الفاسد','#ff596f','#210f35']
  ];
  const supporters=['بتول','إسراء','آلاء','أسماء','هاني','هشام','نهى','علي','جنا','جودي وملك'];
  const keys={},world={platforms:[],candies:[],enemies:[],shots:[],particles:[]};
  let audioCtx=null,muted=false,last=0,camX=0,shake=0,toastTimer=0;
  let game,player,boss;

  function fresh(){return {mode:'menu',level:1,hero:'ليلى',hp:5,maxHp:5,score:0,candies:0,inventory:{heart:1,shield:0,mint:0},route:'',multiplier:1,maryam:false,bossStarted:false,helpPapa:1,helpMama:1,paused:false,storySeed:Math.random()};}
  function reset(){game=fresh();player={x:85,y:520,w:40,h:60,vx:0,vy:0,onGround:false,jumps:0,facing:1,attack:0,invuln:0,shield:0,boost:0};boss=null;}
  reset();

  function beep(freq=440,d=.06,type='sine',vol=.055){if(muted)return;try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.stop(audioCtx.currentTime+d)}catch(e){}}
  function say(text){toast.textContent=text;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2400)}
  function show(html){panel.innerHTML=html;overlay.classList.remove('hidden')}
  function hide(){overlay.classList.add('hidden')}
  function chrome(on=true){hud.hidden=!on;controls.hidden=!on;$('#topActions').hidden=!on}
  function save(){localStorage.setItem('alsakaker-save',JSON.stringify({level:game.level,hero:game.hero,hp:game.hp,maxHp:game.maxHp,score:game.score,candies:game.candies,inventory:game.inventory}))}
  function load(){try{const s=JSON.parse(localStorage.getItem('alsakaker-save'));if(!s)return false;Object.assign(game,s);return true}catch(e){return false}}
  function menu(){chrome(false);game.mode='menu';const can=!!localStorage.getItem('alsakaker-save');show(`<span class="eyebrow">مغامرة عائلية من 15 مرحلة</span><h1 class="logo">السكاكر</h1><div class="subLogo">ليلى وليالي</div><p>عالم الحلوى فقد ألوانه، وكل بوابة تخفي سرًا ووحشًا جديدًا. اختاري بطلتك، اجمعي السكاكر، واتخذي قرارات تغيّر طريق المغامرة.</p><div class="cards"><button class="choice selected" data-hero="ليلى"><b>🦋 ليلى</b><small>فستان لافندر · قفزة أعلى · خفيفة وسريعة</small></button><button class="choice" data-hero="ليالي"><b>🎀 ليالي</b><small>فستان وردي · هجوم أقوى · شجاعة في المواجهة</small></button></div><button class="btn gold" id="startBtn">ابدأ المغامرة</button>${can?'<button class="btn alt" id="continueBtn">متابعة المحفوظ</button>':''}<p class="tip">التحكم: الأسهم أو A/D للحركة · Space للقفز · J للهجوم · Q لتبديل البطلة · 1–3 لاستخدام المخزون</p>`);
    panel.querySelectorAll('[data-hero]').forEach(b=>b.onclick=()=>{panel.querySelectorAll('[data-hero]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');game.hero=b.dataset.hero;beep(620)});
    $('#startBtn').onclick=()=>{const hero=game.hero;reset();game.hero=hero;routeScreen()};
    if(can)$('#continueBtn').onclick=()=>{reset();load();routeScreen()};
  }
  function routeScreen(){chrome(false);game.mode='route';const lv=levels[game.level-1];show(`<span class="eyebrow">المرحلة ${game.level} من 15</span><h2>${lv[0]}</h2><p>وصلت رسالة ممزقة إلى البطلتين، لكن نصفها مفقود. أمامكما طريقان، وكل اختيار يغيّر ما ستواجهانه.</p><div class="cards"><button class="choice" id="safe"><b>🌈 طريق قوس السكر</b><small>أكثر أمانًا · تحصلان على فقاعة حماية · نقاط عادية</small></button><button class="choice" id="risk"><b>🌙 النفق الغامض</b><small>خصوم أسرع · سكاكر أكثر · مضاعف نقاط ×1.5</small></button></div><p class="warning">الصعوبة الآن: ${game.level<6?'متوسطة':game.level<11?'مرتفعة':game.level<15?'صعبة جدًا':'قصوى جدًا'}</p>`);
    $('#safe').onclick=()=>{game.route='safe';game.multiplier=1;game.inventory.shield++;startLevel()};
    $('#risk').onclick=()=>{game.route='risk';game.multiplier=1.5;startLevel()};
  }
  function rng(seed){let x=Math.sin(seed*999.71)*43758.5453;return x-Math.floor(x)}
  function generate(){world.platforms=[];world.candies=[];world.enemies=[];world.shots=[];world.particles=[];const L=game.level,risk=game.route==='risk';
    for(let x=0;x<4250;x+=320){const gap=(x>500&&rng(L*100+x)<(.12+L*.005));if(!gap)world.platforms.push({x,y:GROUND,w:340,h:120,type:'ground'})}
    world.platforms.push({x:4180,y:GROUND,w:1120,h:120,type:'ground'});
    for(let i=0;i<23;i++){const x=300+i*165+rng(L*71+i)*80,y=470-rng(L*31+i)*190,w=105+rng(i+L)*75;world.platforms.push({x,y,w,h:28,type:'cake'});for(let j=0;j<2;j++)if(rng(i*13+j+L)>.22)world.candies.push({x:x+30+j*42,y:y-30,taken:false,bob:rng(i+j)*6.28})}
    for(let x=210;x<4100;x+=145)if(rng(x+L*9)>.47)world.candies.push({x,y:500-rng(x)*170,taken:false,bob:rng(x*2)*6.28});
    const count=8+L+(risk?4:0);for(let i=0;i<count;i++){let x=620+i*(3300/count)+rng(i+L)*150;world.enemies.push({x,y:GROUND-40,w:46,h:40,v:(.75+L*.045+(risk?.35:0))*(i%2?1:-1),hp:1+(L>9&&i%3===0?1:0),alive:true,color:i%2?'#ff4fa3':'#6938cf'})}
    const max=6+L*2+(L===15?15:0);boss={x:4740,y:GROUND-138,w:132,h:138,hp:max,maxHp:max,vx:0,cool:75,phase:0,flash:0};
    player.x=85;player.y=520;player.vx=player.vy=0;game.maryam=false;game.bossStarted=false;game.helpPapa=1;game.helpMama=1;camX=0;
  }
  function startLevel(){generate();game.mode='playing';chrome(true);hide();say(`${game.hero} دخلت ${levels[game.level-1][0]} — الطريق يخفي أكثر مما يبدو`);updateHud()}
  function maryamScreen(){game.mode='maryam';show(`<div class="portrait">👧🏻</div><span class="eyebrow">نقطة منتصف المرحلة</span><h2>مريم وصلت في الوقت المناسب!</h2><p>«استنوا! خُدوا المساعدة دي… الطريق لسه فيه مفاجآت!»</p><div class="cards"><button class="choice" data-gift="heart"><b>💗 قلب الحلوى</b><small>يضيف جرعة علاج إلى المخزون</small></button><button class="choice" data-gift="shield"><b>🫧 فقاعة السكر</b><small>تحمي من ضربة واحدة</small></button><button class="choice" data-gift="mint"><b>👟 حذاء النعناع</b><small>سرعة وقفزة إضافية مؤقتًا</small></button><button class="choice" data-gift="mystery"><b>🎁 الصندوق الغامض</b><small>نتيجته غير معروفة وقد تكون ممتازة… أو مزعجة</small></button></div>`);
    panel.querySelectorAll('[data-gift]').forEach(b=>b.onclick=()=>{let g=b.dataset.gift;if(g==='mystery'){if(Math.random()>.35){game.inventory.heart++;game.inventory.shield++;game.score+=500;say('مفاجأة رائعة: قلب + درع + 500 نقطة!')}else{game.hp=Math.max(1,game.hp-1);game.score+=800;say('فخ سكر حامض! خسرتِ قلبًا وربحتِ 800 نقطة')}}else{game.inventory[g]++;say(`أضافت مريم ${g==='heart'?'قلب الحلوى':g==='shield'?'فقاعة السكر':'حذاء النعناع'} إلى المخزون`)}game.maryam=true;game.mode='playing';hide();updateHud();beep(780,.12,'triangle')});
  }
  function bossIntro(){game.mode='bossIntro';const grandma=game.level%2?'تيتا منى':'تيتا صفاء';const advice=game.level%2?'راقبي نمط الهجوم؛ نقطة الضعف تظهر بعد الضربة الثالثة.':'استني اللحظة الصح؛ الدائرة المضيئة هي وقت الهجوم.';show(`<div class="portrait">${game.level%2?'🧕🏿':'👵🏻'}</div><span class="eyebrow">نصيحة ${grandma}</span><h2>${levels[game.level-1][1]}</h2><p>«${advice}»</p><div class="cards"><div class="choice"><b>👨🏻 مساعدة بابا</b><small>درع قوي لمدة قصيرة أثناء المواجهة</small></div><div class="choice"><b>👩🏻 مساعدة ماما</b><small>تعيد قلبين عند الحاجة أثناء المواجهة</small></div></div><button class="btn gold" id="fight">ابدأ المواجهة</button>`);$('#fight').onclick=()=>{game.mode='boss';game.bossStarted=true;hide();say('G لماما · H لبابا · الهجوم عندما يضيء الوحش');beep(120,.3,'sawtooth')}
  }
  function cutscene(){game.mode='cutscene';chrome(false);const grandma=game.level%2?'تيتا منى':'تيتا صفاء',support=supporters[(game.level-1)%supporters.length],final=game.level===15;const bonus=Math.round((1000+game.level*250)*game.multiplier);game.score+=bonus;save();show(`<span class="eyebrow">مشهد احتفال</span><h2>${final?'عادت الألوان إلى مملكة السكاكر!':'تم إنقاذ '+levels[game.level-1][0]}</h2><div style="font-size:64px;margin:10px">🎊 🦋 🎀 🍬 🎉</div><p>${grandma}: «${game.level%2?'برافو يا ليلى ويا ليالي… السكاكر رجعت تلمع من جديد!':'كنت عارفة إن بطلات السكاكر هيقدروا!'}»</p><p>انضم <b>${support}</b> إلى الاحتفال، لكن بوابة جديدة ظهرت في الأفق… ولم يعرف أحد من فتحها.</p><div class="big">+${bonus} نقطة</div><button class="btn gold" id="next">${final?'شاهد النهاية':'إلى المرحلة التالية'}</button>`);
    $('#next').onclick=()=>{if(final)ending();else{game.level++;game.hp=Math.min(game.maxHp,game.hp+1);save();routeScreen()}}
  }
  function ending(){localStorage.removeItem('alsakaker-save');game.mode='ending';show(`<span class="eyebrow">اكتملت المغامرة</span><h1 class="logo" style="font-size:78px">السكاكر</h1><h2>ليلى وليالي أنقذتا المملكة</h2><p>اجتمعت العائلة كلها، واحتفلت تيتا منى وتيتا صفاء، لكن فوق أعلى برج بقيت قطعة سكر سوداء صغيرة تنبض بضوء خافت…</p><div class="big">النتيجة النهائية: ${game.score.toLocaleString('ar-EG')} · السكاكر: ${game.candies}</div><button class="btn gold" id="again">مغامرة جديدة</button>`);$('#again').onclick=()=>{reset();menu()}}

  function pause(){if(!['playing','boss'].includes(game.mode))return;game.paused=true;const old=game.mode;game.mode='paused';show(`<h2>توقّف مؤقت</h2><p>النقاط والصحة والمخزون محفوظة كما هي.</p><button class="btn gold" id="resume">استمرار</button><button class="btn alt" id="home">القائمة الرئيسية</button>`);$('#resume').onclick=()=>{game.mode=old;game.paused=false;hide()};$('#home').onclick=()=>{save();menu()}}
  function useItem(type){if(!['playing','boss'].includes(game.mode)||!game.inventory[type])return say('هذه المساعدة غير موجودة في المخزون');game.inventory[type]--;if(type==='heart'){game.hp=Math.min(game.maxHp,game.hp+2);say('قلب الحلوى أعاد الصحة')}if(type==='shield'){player.shield=480;say('فقاعة السكر تحميك الآن')}if(type==='mint'){player.boost=600;say('حذاء النعناع: سرعة وقفزة أعلى')}beep(860,.15,'triangle');updateHud()}

  function updateHud(){if(hud.hidden)return;$('#heroName').textContent=`${game.hero} · HP ${game.hp}/${game.maxHp}`;$('#hpText').textContent='♥ '.repeat(game.hp)+'♡ '.repeat(Math.max(0,game.maxHp-game.hp));$('#scoreText').textContent=Math.round(game.score).toLocaleString('ar-EG');$('#candyText').textContent=game.candies;$('#levelText').textContent=`المرحلة ${game.level}/15`;$('#levelName').textContent=levels[game.level-1][0];$('#progress').style.width=Math.min(100,player.x/47)+'%';$('#invText').innerHTML=`<span class="chip">💗 ${game.inventory.heart}</span><span class="chip">🫧 ${game.inventory.shield}</span><span class="chip">👟 ${game.inventory.mint}</span>${game.mode==='boss'?`<span class="chip">👨🏻 ${game.helpPapa}</span><span class="chip">👩🏻 ${game.helpMama}</span>`:''}`}

  function drawConfetti(t){ctx.save();for(let i=0;i<60;i++){const x=(i*97+t*80*(i%3+1))%W,y=(i*53+t*110*(i%4+1))%H;ctx.fillStyle=['#ff4fa3','#ffd85d','#43ddff','#8f63ed'][i%4];ctx.fillRect(x,y,7,15)}ctx.restore()}
  function frame(ts){const dt=Math.min(32,ts-last);last=ts;if(dt&& !game.paused)update();draw();requestAnimationFrame(frame)}
  addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')jump();if(e.code==='KeyJ')attack();if(e.code==='KeyQ'&&['playing','boss'].includes(game.mode)){game.hero=game.hero==='ليلى'?'ليالي':'ليلى';say(`الآن تلعبين بـ ${game.hero}`)}if(e.code==='Digit1')useItem('heart');if(e.code==='Digit2')useItem('shield');if(e.code==='Digit3')useItem('mint');if(e.code==='KeyG'&&game.mode==='boss'){if(game.helpMama){game.helpMama=0;game.hp=Math.min(game.maxHp,game.hp+2);say('ماما أعادت قلبين');updateHud()}}if(e.code==='KeyH'&&game.mode==='boss'){if(game.helpPapa){game.helpPapa=0;player.shield=360;say('بابا صنع درع حماية');updateHud()}}if(e.code==='Escape')pause()});addEventListener('keyup',e=>keys[e.code]=false);
  document.querySelectorAll('[data-key]').forEach(b=>{const code=b.dataset.key;const down=e=>{e.preventDefault();keys[code]=true;if(code==='Space')jump();if(code==='KeyJ')attack()};const up=e=>{e.preventDefault();keys[code]=false};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up)});
  $('#itemBtn').onclick=cycleItem;$('#helpBtn').onclick=familyHelp;$('#pauseBtn').onclick=pause;$('#muteBtn').onclick=()=>{muted=!muted;$('#muteBtn').textContent=muted?'🔇':'🔊'};$('#fullBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():$('#shell').requestFullscreen?.();
  menu();requestAnimationFrame(frame);
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
  }
})();
</script>
